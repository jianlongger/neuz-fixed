name: 'Build Neuz MSI (fixed-point)'

on:
  workflow_dispatch:
  push:
    branches:
      - base-0.16.4

permissions:
  contents: write

env:
  CI: false

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend deps and build
        run: yarn && yarn build

      - name: Build Tauri MSI
        run: yarn tauri build

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: Neuz-0.16.4-msi
          path: src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

      # Fallback retrieval: push the MSI to a dedicated branch so it can be
      # fetched via git even if the workflow artifact is purged by the account.
      - name: Push MSI to build-artifacts branch
        if: success()
        shell: bash
        continue-on-error: true
        run: |
          set -e
          MSI=$(ls src-tauri/target/release/bundle/msi/*.msi | head -1)
          echo "Found MSI: $MSI"
          mkdir -p _out
          cp "$MSI" _out/Neuz_0.16.4.msi
          git config user.email "neuz-bot@local"
          git config user.name "Neuz Builder"
          git add -f _out/Neuz_0.16.4.msi
          git commit -m "ci: Neuz 0.16.4 MSI ($(date -u +%Y-%m-%dT%H:%M:%SZ))" || echo "nothing to commit"
          git push -f origin HEAD:build-artifacts
