name: 'Build Neuz MSI (fixed-point)'

on:
  workflow_dispatch:
  push:
    branches:
      - base-0.16.4

permissions:
  contents: write
  issues: write

env:
  CI: false

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Ensure yarn available
        run: npm install -g yarn

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend deps
        shell: bash
        continue-on-error: true
        run: yarn install 2>&1 | tee frontend-install.log

      - name: Build frontend
        shell: bash
        continue-on-error: true
        run: yarn build 2>&1 | tee frontend.log

      - name: Build Tauri MSI
        shell: bash
        continue-on-error: true
        run: yarn tauri build 2>&1 | tee build.log

      - name: Upload MSI artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Neuz-0.16.4-msi
          path: src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

      # Reliable visibility: post the tail of the build log back as a repo issue,
      # because this account purges workflow logs and artifacts.
      - name: Report build log via issue
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BODY=$(tail -c 6000 build.log 2>/dev/null | jq -Rs .)
          curl -s -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -d "{\"title\":\"CI build log $(date -u +%H%M%S) sha=${{ github.sha }}\",\"body\":$BODY}" \
            https://api.github.com/repos/jianlongger/neuz-fixed/issues
