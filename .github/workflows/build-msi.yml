name: 'Build Neuz MSI (fixed-point)'

on:
  workflow_dispatch:
  push:
    branches:
      - base-0.16.4

permissions:
  contents: write

env:
  CI: false

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend deps and build
        shell: bash
        run: yarn && yarn build 2>&1 | tee frontend.log

      - name: Build Tauri MSI
        shell: bash
        run: yarn tauri build 2>&1 | tee build.log

      - name: Upload MSI artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Neuz-0.16.4-msi
          path: src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

      # Always capture build logs to a branch so we can read errors even when
      # this account purges workflow logs.
      - name: Push build logs to branch (always)
        if: always()
        shell: bash
        continue-on-error: true
        run: |
          mkdir -p _log
          cp build.log _log/build.log 2>/dev/null || echo "no build.log"
          cp frontend.log _log/frontend.log 2>/dev/null || echo "no frontend.log"
          git config user.email "neuz-bot@local"
          git config user.name "Neuz Builder"
          git add -f _log/build.log _log/frontend.log
          git commit -m "ci: build logs $(date -u +%H%M%S)" || echo "nothing to commit"
          git push -f origin HEAD:build-logs
