name: Diag Rust check (fixed)

on:
  workflow_dispatch:
  push:
    branches: [ diag ]

permissions:
  contents: write

jobs:
  diag:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri'
          cache-on-failure: true

      - name: cargo check (capture output)
        shell: pwsh
        run: |
          New-Item -Path $env:GITHUB_WORKSPACE -Name diag_err.txt -ItemType File -Force
          Add-Content $env:GITHUB_WORKSPACE\diag_err.txt "STEP_REACHED=cargo_check"
          cd src-tauri
          cargo check --message-format=short *> $env:GITHUB_WORKSPACE\diag_err.txt 2>&1
          Add-Content $env:GITHUB_WORKSPACE\diag_err.txt "CARGO_EXIT=$LASTEXITCODE"

      - name: Commit error back to repo
        if: always()
        shell: pwsh
        run: |
          cd $env:GITHUB_WORKSPACE
          git config user.email "diag@local"
          git config user.name "diag-bot"
          git add diag_err.txt
          git commit -m "diag: cargo check output" | Out-Null
          git push origin HEAD:refs/heads/diag-err
