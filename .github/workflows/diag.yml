name: Diag Rust check (fixed)

on:
  workflow_dispatch:
  push:
    branches: [ diag ]

jobs:
  diag:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri'
          cache-on-failure: true

      - name: cargo check (capture output)
        shell: pwsh
        run: |
          New-Item -Path $env:GITHUB_WORKSPACE -Name check.txt -ItemType File -Force
          cd src-tauri
          cargo check --message-format=short *> $env:GITHUB_WORKSPACE\check.txt 2>&1
          Add-Content $env:GITHUB_WORKSPACE\check.txt "EXITCODE=$LASTEXITCODE"

      - name: Upload diag artifact
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: rust-diag
          path: ${{ github.workspace }}/check.txt
